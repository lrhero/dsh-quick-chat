# Reference bundle patch for dsh-quick-chat.
#
# This file is what a bundle install would apply. The profile used here inserts
# the same row from $DSH_HOME/profiles/<name>/cordis.patch.yml instead, so this
# copy stays inert unless the package is listed in dsh.profile.bundles.
- insert:
    - id: quick-chat
      name: dsh-quick-chat
      config:
        # proper = A 版（矢量图标）；fun = B 版（头像 + 点击音效）
        iconStyle: proper
        # 图标颜色：grad（默认，蓝→青渐变）/ blue / white / black / auto（跟随主题）
        iconColor: grad
        # 点击音效开关（界面上的喇叭按钮也能切）
        voiceEnabled: true
        # B 版音效音量 0~1
        voiceVolume: 0.7
        # 音效留空即静默；把音频放到 assets/voice/<id>.mp3 后跑 tools/embed-voice.mjs
        voices: {}
        sources:
          - id: deepseek
            label: DeepSeek
            url: https://chat.deepseek.com/
            icon: deepseek
          - id: doubao
            label: 豆包
            url: https://www.doubao.com/chat/
            icon: doubao
          - id: gemini
            label: Gemini
            url: https://gemini.google.com/app
            icon: gemini
            userAgent: electron


